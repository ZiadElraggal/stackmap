name: Homebrew

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "stackmap/**"
      - "pyproject.toml"
      - ".github/workflows/homebrew.yml"
  pull_request:
    branches: [main]
    paths:
      - "Formula/**"
      - "stackmap/**"
      - "pyproject.toml"
      - ".github/workflows/homebrew.yml"

jobs:
  brew-install-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify packaged web assets are synced
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          rm -rf .nuxt .output
          npm run generate
          cd ..
          python3 -m stackmap.webapp.build_assets --clean
          git diff --exit-code -- stackmap/webapp/static
          test -f stackmap/webapp/static/index.html

      - name: Build local source archive
        run: |
          tar --exclude-vcs -czf /tmp/stackmap-ci.tar.gz .
          SHA256="$(shasum -a 256 /tmp/stackmap-ci.tar.gz | awk '{print $1}')"
          echo "STACKMAP_SHA256=${SHA256}" >> "$GITHUB_ENV"

      - name: Create temporary local tap and formula
        run: |
          brew tap-new stackmap/local
          TAP_DIR="$(brew --repository)/Library/Taps/stackmap/homebrew-local"
          mkdir -p "${TAP_DIR}/Formula"
          cat > "${TAP_DIR}/Formula/stackmap.rb" <<EOF
          class Stackmap < Formula
            desc "Architecture diagrams that generate themselves from infrastructure code"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "file:///tmp/stackmap-ci.tar.gz"
            version "0.0.0-ci"
            sha256 "${STACKMAP_SHA256}"
            license "MIT"

            depends_on "python@3.12"

            def install
              python = Formula["python@3.12"].opt_bin/"python3.12"
              system python, "-m", "venv", libexec
              system libexec/"bin/pip", "install", "--upgrade", "pip"
              system libexec/"bin/pip", "install", buildpath
              bin.install_symlink libexec/"bin/stackmap"
            end

            test do
              output = shell_output("#{bin}/stackmap version")
              assert_match "stackmap", output
            end
          end
          EOF

      - name: Install StackMap formula
        run: brew install stackmap/local/stackmap

      - name: Smoke test
        run: |
          stackmap --help
          stackmap version
          stackmap scan --source tests/fixtures/sam-simple.json --format json --output /tmp/stackmap-smoke.json
          test -s /tmp/stackmap-smoke.json
          stackmap serve --source tests/fixtures/sam-simple.json --host 127.0.0.1 --port 3011 --no-open >/tmp/stackmap-serve.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3
          curl -sf http://127.0.0.1:3011/api/health | grep '"status": "ok"'
          curl -sf http://127.0.0.1:3011/api/graph | grep '"nodes"'
          curl -sf http://127.0.0.1:3011/ >/tmp/stackmap-homebrew-index.html
          ! grep -q '@vite/client' /tmp/stackmap-homebrew-index.html
          ! grep -q 'node_modules/nuxt/dist/app/entry.js' /tmp/stackmap-homebrew-index.html
