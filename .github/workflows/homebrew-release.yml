name: Homebrew Release

on:
  release:
    types: [published]

jobs:
  publish-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release source archive
        id: release
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ASSET_NAME="stackmap-${VERSION}-source.tar.gz"
          cd frontend
          npm ci
          rm -rf .nuxt .output
          npm run generate
          cd ..
          python3 -m stackmap.webapp.build_assets --clean
          test -f stackmap/webapp/static/index.html
          tar --exclude-vcs -czf "/tmp/${ASSET_NAME}" .
          SHA256="$(sha256sum "/tmp/${ASSET_NAME}" | awk '{print $1}')"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_path=/tmp/${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload release source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.release.outputs.tag_name }}" "${{ steps.release.outputs.asset_path }}" --clobber

      - name: Compute release asset URL
        id: asset
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "url=https://github.com/${REPOSITORY}/releases/download/${{ steps.release.outputs.tag_name }}/${{ steps.release.outputs.asset_name }}" >> "$GITHUB_OUTPUT"

      - name: Render formula
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/render_homebrew_formula.py \
            --version "${{ steps.release.outputs.version }}" \
            --sha256 "${{ steps.release.outputs.sha256 }}" \
            --repository "${REPOSITORY}" \
            --url "${{ steps.asset.outputs.url }}" \
            --output /tmp/stackmap.rb

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackmap-homebrew-formula
          path: /tmp/stackmap.rb

      - name: Push formula to tap repository
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ] || [ -z "${HOMEBREW_TAP_REPO:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN or HOMEBREW_TAP_REPO missing; skipping tap push."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp /tmp/stackmap.rb /tmp/homebrew-tap/Formula/stackmap.rb
          cd /tmp/homebrew-tap
          git add Formula/stackmap.rb
          git commit -m "stackmap ${VERSION}" || exit 0
          git push origin HEAD
