name: Homebrew Release

on:
  release:
    types: [published]

jobs:
  publish-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify packaged web assets are synced
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          rm -rf .nuxt .output
          npm run generate
          cd ..
          python3 -m stackmap.webapp.build_assets --clean
          git diff --exit-code -- stackmap/webapp/static
          test -f stackmap/webapp/static/index.html

      - name: Compute archive SHA256
        id: release
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          URL="https://github.com/${REPOSITORY}/archive/refs/tags/${TAG_NAME}.tar.gz"
          curl -L "$URL" -o /tmp/stackmap-release.tar.gz
          SHA256="$(sha256sum /tmp/stackmap-release.tar.gz | awk '{print $1}')"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Render formula
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/render_homebrew_formula.py \
            --version "${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.tag_name }}" \
            --sha256 "${{ steps.release.outputs.sha256 }}" \
            --repository "${REPOSITORY}" \
            --output /tmp/stackmap.rb

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackmap-homebrew-formula
          path: /tmp/stackmap.rb

      - name: Push formula to tap repository
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ] || [ -z "${HOMEBREW_TAP_REPO:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN or HOMEBREW_TAP_REPO missing; skipping tap push."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp /tmp/stackmap.rb /tmp/homebrew-tap/Formula/stackmap.rb
          cd /tmp/homebrew-tap
          git add Formula/stackmap.rb
          git commit -m "stackmap ${VERSION}" || exit 0
          git push origin HEAD
