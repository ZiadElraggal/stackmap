name: Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows-binary:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run generate
          cd ..
          python -m stackmap.webapp.build_assets --clean
          test -f stackmap/webapp/static/index.html

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name stackmap --collect-data stackmap --copy-metadata stackmap stackmap/cli/main.py

      - name: Package Windows release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"
          fi
          ASSET_NAME="stackmap-${VERSION}-windows-x64.zip"
          powershell -Command "Compress-Archive -Path 'dist/stackmap.exe' -DestinationPath '${ASSET_NAME}' -Force"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackmap-windows-x64
          path: ${{ steps.package.outputs.asset_name }}

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.asset_name }}" --clobber
