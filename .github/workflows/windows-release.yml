name: Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows-binary:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      exe_url: ${{ steps.package.outputs.exe_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run generate
          cd ..
          python -m stackmap.webapp.build_assets --clean
          test -f stackmap/webapp/static/index.html
          echo "Frontend bundle built successfully"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Verify package installation
        run: |
          python -c "from stackmap.cli.main import app; print('Package imports OK')"
          python -c "import stackmap; print(f'Version: {stackmap.__version__}')"

      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name stackmap --collect-data stackmap --copy-metadata stackmap stackmap/cli/main.py

      - name: Verify executable
        shell: bash
        run: |
          ./dist/stackmap.exe version
          echo "Executable verified successfully"

      - name: Package Windows release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "exe_url=https://github.com/${{ github.repository }}/releases/download/v${VERSION}/stackmap-${VERSION}-windows-x64.exe" >> "$GITHUB_OUTPUT"

          # Rename exe with version for release asset
          cp dist/stackmap.exe "stackmap-${VERSION}-windows-x64.exe"
          echo "Packaged as stackmap-${VERSION}-windows-x64.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackmap-windows-x64
          path: stackmap-${{ steps.package.outputs.version }}-windows-x64.exe

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "stackmap-${{ steps.package.outputs.version }}-windows-x64.exe" --clobber

  publish-winget:
    needs: build-windows-binary
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            Write-Host "WINGET_PAT secret not set; skipping winget submission."
            exit 0
          }
          $version = "${{ needs.build-windows-binary.outputs.version }}"
          $url = "${{ needs.build-windows-binary.outputs.exe_url }}"
          ./wingetcreate.exe update ZiadElraggal.StackMap `
            --version $version `
            --urls $url `
            --submit `
            --token $env:WINGET_PAT
