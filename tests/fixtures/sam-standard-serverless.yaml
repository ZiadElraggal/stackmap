AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Standard SAM serverless app fixture for StackMap

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Tracing: Active

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: stackmap-sam-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stackmap-sam-jobs

  ApiHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stackmap-sam-api-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt AppTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt JobsQueue.Arn

  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stackmap-sam-api-handler
      Handler: app.handler
      CodeUri: src/
      Role: !GetAtt ApiHandlerRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          JOBS_QUEUE_URL: !Ref JobsQueue
      Events:
        GetUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: GET
        PostUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: POST

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

